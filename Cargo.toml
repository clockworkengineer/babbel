[workspace]
resolver = "3"
members = [
    "crates/babbel_core",
    "crates/babbel",
    "crates/xml",
    "crates/json",
    "crates/yaml",
    "crates/bencode",
    "crates/toml",
    "crates/msgpack",
    "crates/cbor",
    "crates/bson",
    "crates/ron",
    "crates/kdl",
    "crates/parquet",
]

[workspace.dependencies]
babbel_core = { path = "crates/babbel_core", version = "0.2.1" }
babbel_xml = { path = "crates/xml", version = "0.2.1" }
babbel_json = { path = "crates/json", version = "0.2.1" }
babbel_yaml = { path = "crates/yaml", version = "0.2.1" }
babbel_bencode = { path = "crates/bencode", version = "0.2.1" }
babbel_toml = { path = "crates/toml", version = "0.2.1" }
babbel_msgpack = { path = "crates/msgpack", version = "0.2.1" }
babbel_cbor = { path = "crates/cbor", version = "0.2.1" }
babbel_bson = { path = "crates/bson", version = "0.2.1" }
babbel_ron = { path = "crates/ron", version = "0.2.1" }
babbel_kdl = { path = "crates/kdl", version = "0.2.1" }
babbel_parquet = { path = "crates/parquet", version = "0.2.1" }



[workspace.package]
version = "0.2.1"
authors = ["ClockworkEngineer", "Babbel Contributors"]
edition = "2024"
license = "MIT"
repository = "https://github.com/clockworkengineer/babbel"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
strip = "symbols"

[profile.release-small]
inherits = "release"
opt-level = "z"
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true

[profile.dev]
opt-level = 1
incremental = false

[profile.test]
incremental = false
