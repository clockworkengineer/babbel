[package]
name = "babbel_cbor"
version.workspace = true
edition.workspace = true
description = "Fast, binary-safe RFC 8949 CBOR parser, serializer, and FormatEngine in pure Rust"
license.workspace = true
authors.workspace = true
repository.workspace = true
documentation = "https://docs.rs/babbel_cbor"
homepage.workspace = true
rust-version.workspace = true
keywords = ["cbor", "rfc8949", "binary", "parser", "serializer"]
categories = ["parser-implementations", "encoding"]
readme = "README.md"

[lints]
workspace = true

[features]
default = ["std"]
std = ["alloc", "babbel_core/std", "babbel_core/file-io"]
alloc = ["babbel_core/alloc"]

[dependencies]
babbel_core = { path = "../babbel_core", version = "0.2.2", default-features = false }

[dev-dependencies]
babbel_json = { path = "../json" }
