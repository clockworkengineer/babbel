[package]
name = "babbel_json"
version.workspace = true
edition.workspace = true
description = "Fast, modular JSON toolkit with streaming parsers, JSON Pointer (RFC 6901), and Merge Patch"
license.workspace = true
authors.workspace = true
repository.workspace = true
documentation = "https://docs.rs/babbel_json"
homepage.workspace = true
rust-version.workspace = true
keywords = ["json", "serialization", "parser", "rust", "library"]
categories = ["encoding", "parser-implementations", "data-structures"]
readme = "README.md"

[lints]
workspace = true


[features]
default = [
    "std",
    "file-io",
    "format-bencode",
    "format-yaml",
    "format-xml",
    "format-toml",
    "json-pointer",
]
std = ["alloc", "babbel_core/std"]
alloc = ["babbel_core/alloc"]

# Optional I/O capabilities
file-io = ["std", "babbel_core/file-io"]

# Optional format converters
format-bencode = []
format-yaml = []
format-xml = []
format-toml = []

# JSON Pointer support (RFC 6901)
json-pointer = []

[dependencies]
babbel_core = { path = "../babbel_core", version = "0.2.1", default-features = false }
arrayvec = "0.7.6"
dtoa = "1.0.11"
itoa = "1.0.17"
smallvec = "1.15.1"
