[package]
name = "babbel_toml"
version.workspace = true
edition.workspace = true
description = "Fast, pure-Rust, zero-allocation TOML v1.0.0 parser, serializer, streaming pull parser, and DOM"
license.workspace = true
authors.workspace = true
repository.workspace = true
documentation = "https://docs.rs/babbel_toml"
homepage.workspace = true
rust-version.workspace = true
keywords = ["toml", "serialization", "parser", "rust", "library"]
categories = ["encoding", "parser-implementations", "data-structures"]
readme = "README.md"

[lints]
workspace = true

[features]
default = [
    "std",
    "file-io",
    "format-converters",
]
std = ["alloc", "babbel_core/std"]
alloc = ["babbel_core/alloc"]
file-io = ["std", "babbel_core/file-io"]
format-converters = []
embedded = []

[dependencies]
babbel_core = { path = "../babbel_core", version = "0.2.2", default-features = false }
arrayvec = "0.7.6"
dtoa = "1.0.11"
itoa = "1.0.17"
smallvec = "1.15.1"
