# Application Configuration Example
title = "Babbel Microservice Engine"
version = "0.2.0"
active = true

[server]
host = "0.0.0.0"
port = 8080
max_connections = 10_000
request_timeout_ms = 2500
allowed_origins = [ "https://example.com", "https://api.example.com" ]

[logging]
level = "info"
json_output = true
file_path = "/var/log/babbel.log"
