[package]
name = "xml_lib_rust"
version = "1.2.2"
edition = "2021"
authors = ["ClockworkEngineer", "Rust Port Team"]
description = "Full-featured XML parser, validator, stringifier, and XPath 1.0 engine in pure Rust"
license = "MIT"
repository = "https://github.com/clockworkengineer/xml"
documentation = "https://docs.rs/xml_lib_rust"
readme = "../README.md"

[features]
default = ["std", "dtd", "xsd", "xpath", "stringify"]
std = ["alloc", "babbel_core/std"]
alloc = ["babbel_core/alloc"]
dtd = []
xsd = []
xpath = []
stringify = []
embedded = []
small_nodes = []
serde = ["dep:serde"]

[dependencies]
babbel_core = { path = "../babbel_core", default-features = false }
thiserror = "1.0"
serde = { version = "1.0", default-features = false, features = ["alloc", "derive"], optional = true }

[dev-dependencies]
criterion = "0.5"
serde = { version = "1.0", features = ["derive"] }

