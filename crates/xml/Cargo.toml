[package]
name = "babbel_xml"
version.workspace = true
edition.workspace = true
authors.workspace = true
description = "Full-featured XML parser, validator, stringifier, and XPath 1.0 engine in pure Rust"
license.workspace = true
repository.workspace = true
documentation = "https://docs.rs/babbel_xml"
homepage.workspace = true
rust-version.workspace = true
readme = "README.md"
keywords = ["xml", "xpath", "xsd", "dtd", "parser"]
categories = ["parser-implementations", "encoding"]

[lints]
workspace = true

[features]
default = ["std", "dtd", "xsd", "xpath", "stringify", "format-converters"]
std = ["alloc", "babbel_core/std"]
alloc = ["babbel_core/alloc"]
dtd = []
xsd = []
xpath = []
stringify = []
format-converters = []
embedded = []
small_nodes = []
serde = ["dep:serde"]

[dependencies]
babbel_core = { path = "../babbel_core", version = "0.2.1", default-features = false }
thiserror = "1.0"
serde = { version = "1.0", default-features = false, features = ["alloc", "derive"], optional = true }

[dev-dependencies]
criterion = "0.5"
serde = { version = "1.0", features = ["derive"] }
