[package]
name = "babbel_core"
version.workspace = true
edition.workspace = true
description = "Shared core I/O, encoding, numeric, error, and AST primitives for the Babbel data format family"
license.workspace = true
authors.workspace = true
readme = "README.md"
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/babbel_core"
rust-version.workspace = true
keywords = ["core", "io", "ast", "serialization", "encoding"]
categories.workspace = true

[lints]
workspace = true

[features]
default = ["std", "file-io", "serde"]
std = ["alloc"]
alloc = []
file-io = ["std"]
serde = ["dep:serde", "alloc"]

[dependencies]
itoa = "1.0.17"
dtoa = "1.0.11"
smallvec = { version = "1.15.1", default-features = false }
arrayvec = { version = "0.7.6", default-features = false }
serde = { version = "1.0", default-features = false, features = ["alloc"], optional = true }

[dev-dependencies]
serde = { version = "1.0", features = ["derive"] }

