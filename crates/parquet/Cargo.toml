[package]
name = "babbel_parquet"
version.workspace = true
edition.workspace = true
description = "Fast, pure-Rust Apache Parquet columnar reader, writer, and FormatEngine"
license.workspace = true
authors.workspace = true
repository.workspace = true
documentation = "https://docs.rs/babbel_parquet"
homepage.workspace = true
rust-version.workspace = true
keywords = ["parquet", "columnar", "apache", "reader", "writer"]
categories = ["parser-implementations", "encoding"]
readme = "README.md"

[lints]
workspace = true

[features]
default = ["std"]
std = ["alloc", "babbel_core/std", "babbel_core/file-io"]
alloc = ["babbel_core/alloc"]

[dependencies]
babbel_core = { path = "../babbel_core", version = "0.2.2", default-features = false }
