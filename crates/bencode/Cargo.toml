[package]
name = "babbel_bencode"
version.workspace = true
edition.workspace = true
description = "Fast, binary-safe BitTorrent Bencode parser, serializer, and DOM in pure Rust"
license.workspace = true
authors.workspace = true
repository.workspace = true
documentation = "https://docs.rs/babbel_bencode"
homepage.workspace = true
rust-version.workspace = true
keywords = ["bencode", "bittorrent", "parser", "serializer"]
categories = ["parser-implementations", "encoding"]
readme = "README.md"

[lints]
workspace = true

[features]
default = ["std", "json", "toml", "xml", "yaml"]
std = ["babbel_core/std", "babbel_core/file-io"]
json = []
toml = []
xml = []
yaml = []

[dependencies]
babbel_core = { path = "../babbel_core", version = "0.2.2", default-features = false }
