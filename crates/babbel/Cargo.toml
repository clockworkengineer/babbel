[package]
name = "babbel"
version.workspace = true
edition.workspace = true
description = "Fast, modular, multi-format serialization and document processing toolkit for Rust"
license.workspace = true
authors.workspace = true
readme = "README.md"
repository.workspace = true
documentation = "https://docs.rs/babbel"
homepage.workspace = true
rust-version.workspace = true
keywords.workspace = true
categories.workspace = true

[lints]
workspace = true

[features]
default = ["std", "json", "yaml", "xml", "bencode", "toml", "msgpack", "cbor", "bson", "ron", "kdl", "parquet", "hcl", "avro", "convert", "serde"]
std = ["alloc", "babbel_core/std"]
alloc = ["babbel_core/alloc"]
json = ["dep:babbel_json", "babbel_json/format-yaml", "babbel_json/format-xml", "babbel_json/format-bencode"]
yaml = ["dep:babbel_yaml"]
xml = ["dep:babbel_xml"]
bencode = ["dep:babbel_bencode"]
toml = ["dep:babbel_toml"]
msgpack = ["dep:babbel_msgpack"]
cbor = ["dep:babbel_cbor"]
bson = ["dep:babbel_bson"]
ron = ["dep:babbel_ron"]
kdl = ["dep:babbel_kdl"]
parquet = ["dep:babbel_parquet"]
hcl = ["dep:babbel_hcl"]
avro = ["dep:babbel_avro"]
convert = ["json", "yaml", "xml", "bencode", "toml", "msgpack", "cbor", "bson", "ron", "kdl", "parquet", "hcl", "avro"]
serde = ["dep:serde", "babbel_core/serde"]

[dependencies]
babbel_core = { path = "../babbel_core", version = "0.2.2" }
babbel_json = { path = "../json", version = "0.2.2", optional = true }
babbel_yaml = { path = "../yaml", version = "0.2.2", optional = true }
babbel_xml = { path = "../xml", version = "0.2.2", optional = true }
babbel_bencode = { path = "../bencode", version = "0.2.2", optional = true }
babbel_toml = { path = "../toml", version = "0.2.2", optional = true }
babbel_msgpack = { path = "../msgpack", version = "0.2.2", optional = true }
babbel_cbor = { path = "../cbor", version = "0.2.2", optional = true }
babbel_bson = { path = "../bson", version = "0.2.2", optional = true }
babbel_ron = { path = "../ron", version = "0.2.2", optional = true }
babbel_kdl = { path = "../kdl", version = "0.2.2", optional = true }
babbel_parquet = { path = "../parquet", version = "0.2.2", optional = true }
babbel_hcl = { path = "../hcl", version = "0.2.2", optional = true }
babbel_avro = { path = "../avro", version = "0.2.2", optional = true }
serde = { version = "1.0", default-features = false, features = ["alloc"], optional = true }

[dev-dependencies]
serde = { version = "1.0", features = ["derive"] }
