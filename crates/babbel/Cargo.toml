[package]
name = "babbel"
version = "0.1.0"
edition = "2024"
description = "Fast, modular, multi-format serialization and document processing toolkit for Rust"
license = "MIT"
authors = ["ClockworkEngineer", "Babbel Contributors"]
readme = "README.md"

[features]
default = ["std", "json", "yaml", "xml", "bencode", "convert"]
std = ["babbel_core/std"]
alloc = ["babbel_core/alloc"]
json = ["dep:json_lib", "json_lib/format-yaml", "json_lib/format-xml", "json_lib/format-bencode"]
yaml = ["dep:yaml_lib"]
xml = ["dep:xml_lib"]
bencode = ["dep:bencode_lib"]
convert = ["json", "yaml", "xml", "bencode"]

[dependencies]
babbel_core = { path = "../babbel_core" }
json_lib = { path = "../json", optional = true }
yaml_lib = { path = "../yaml", optional = true }
xml_lib = { path = "../xml", optional = true }
bencode_lib = { path = "../bencode", optional = true }
