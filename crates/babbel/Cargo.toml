[package]
name = "babbel"
version = "0.2.1"
edition = "2024"
description = "Fast, modular, multi-format serialization and document processing toolkit for Rust"
license = "MIT"
authors = ["ClockworkEngineer", "Babbel Contributors"]
readme = "README.md"
repository = "https://github.com/clockworkengineer/babbel"
documentation = "https://docs.rs/babbel"
homepage = "https://github.com/clockworkengineer/babbel"

[features]
default = ["std", "json", "yaml", "xml", "bencode", "toml", "msgpack", "cbor", "bson", "ron", "kdl", "convert", "serde"]
std = ["alloc", "babbel_core/std"]
alloc = ["babbel_core/alloc"]
json = ["dep:babbel_json", "babbel_json/format-yaml", "babbel_json/format-xml", "babbel_json/format-bencode"]
yaml = ["dep:babbel_yaml"]
xml = ["dep:babbel_xml"]
bencode = ["dep:babbel_bencode"]
toml = ["dep:babbel_toml"]
msgpack = ["dep:babbel_msgpack"]
cbor = ["dep:babbel_cbor"]
bson = ["dep:babbel_bson"]
ron = ["dep:babbel_ron"]
kdl = ["dep:babbel_kdl"]
convert = ["json", "yaml", "xml", "bencode", "toml", "msgpack", "cbor", "bson", "ron", "kdl"]
serde = ["babbel_core/serde"]

[dependencies]
babbel_core = { path = "../babbel_core", version = "0.2.1" }
babbel_json = { path = "../json", version = "0.2.1", optional = true }
babbel_yaml = { path = "../yaml", version = "0.2.1", optional = true }
babbel_xml = { path = "../xml", version = "0.2.1", optional = true }
babbel_bencode = { path = "../bencode", version = "0.2.1", optional = true }
babbel_toml = { path = "../toml", version = "0.2.1", optional = true }
babbel_msgpack = { path = "../msgpack", version = "0.2.1", optional = true }
babbel_cbor = { path = "../cbor", version = "0.2.1", optional = true }
babbel_bson = { path = "../bson", version = "0.2.1", optional = true }
babbel_ron = { path = "../ron", version = "0.2.1", optional = true }
babbel_kdl = { path = "../kdl", version = "0.2.1", optional = true }
