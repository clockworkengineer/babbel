[package]
name = "babbel_kdl"
version.workspace = true
edition.workspace = true
description = "Fast, pure-Rust KDL (KDL Document Language) parser, serializer, and FormatEngine"
license.workspace = true
authors.workspace = true
repository.workspace = true
documentation = "https://docs.rs/babbel_kdl"
homepage.workspace = true
rust-version.workspace = true
keywords = ["kdl", "document-language", "parser", "serializer"]
categories = ["parser-implementations", "encoding"]
readme = "README.md"

[lints]
workspace = true

[features]
default = ["std"]
std = ["alloc", "babbel_core/std", "babbel_core/file-io"]
alloc = ["babbel_core/alloc"]

[dependencies]
babbel_core = { path = "../babbel_core", version = "0.2.1", default-features = false }

[dev-dependencies]
babbel_json = { path = "../json" }
