[package]
name = "babbel_yaml"
version = "0.2.0"
edition = "2024"
description = "Fast, modular YAML 1.2 parser and emitter with anchors, aliases, and tags"
license = "MIT"
authors = ["ClockworkEngineer", "Babbel Contributors"]
repository = "https://github.com/clockworkengineer/babbel"
documentation = "https://docs.rs/babbel_yaml"
homepage = "https://github.com/clockworkengineer/babbel"
readme = "README.md"

[features]
default = [
    "std",
    "alloc",
    "stringify",
    "format-converters",
    "file-io",
    "validation",
    "embedded",
]
std = ["alloc", "babbel_core/std"]
alloc = ["babbel_core/alloc"]
embedded = []
parse-only = []
stringify = ["alloc"]
format-converters = ["stringify"]
file-io = ["std", "babbel_core/file-io"]
debug-trace = []
debug-anchors = []
validation = ["dep:regex", "alloc"]

[dependencies]
babbel_core = { path = "../babbel_core", version = "0.2.0", default-features = false }
base64 = { version = "0.22.1", optional = true }
log = "0.4.28"
regex = { version = "1.12.2", optional = true }
