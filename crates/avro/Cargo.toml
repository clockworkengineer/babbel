[package]
name = "babbel_avro"
version = "0.2.1"
edition = "2024"
description = "Fast, pure-Rust Apache Avro binary and Object Container File (OCF) parser, serializer, and FormatEngine"
license = "MIT"
authors = ["ClockworkEngineer", "Babbel Contributors"]
repository = "https://github.com/clockworkengineer/babbel"
documentation = "https://docs.rs/babbel_avro"
homepage = "https://github.com/clockworkengineer/babbel"
readme = "README.md"

[features]
default = ["std"]
std = ["alloc", "babbel_core/std", "babbel_core/file-io", "babbel_json/std"]
alloc = ["babbel_core/alloc", "babbel_json/alloc"]

[dependencies]
babbel_core = { path = "../babbel_core", version = "0.2.1", default-features = false }
babbel_json = { path = "../json", version = "0.2.1", default-features = false }
